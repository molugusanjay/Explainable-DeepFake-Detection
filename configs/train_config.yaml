# REFERENCE ONLY: no project script parses this YAML file.
# Actual behavior is controlled by src/train.py CLI arguments.
# Values below document generic standalone CLI defaults, NOT the selected run.
# Selected mixed run: 6 epochs, workers 0, patience 3; see experiment_config.yaml
# and models/checkpoints/final_frequency/calibrated.pt training_args.

record_type: "reference_only_standalone_defaults"

training:
  backbone: "tiny"
  mode: "both"
  epochs: 20
  batch_size: 8
  accumulation: 2
  workers: 2
  learning_rate: 0.00004
  weight_decay: 0.01      # Fixed in src/train.py; not a configurable CLI flag
  patience: 5
  seed: 42

model:
  patch_size: 7          # Fixed by src/train.py architecture configuration
  cutoff: 0.25          # Retains (u/(H-1) + v/(W-1))/2 > cutoff, with safe denominators
  pretrained: true      # CLI defaults to ImageNet unless resuming/transferring or --no-pretrained

paths:
  manifest: "data/prepared/manifest.csv"
  output: "results/runs/frequency"
  torch_home: "models/assets/torch"

# Data/manifests are not included in this inference package.
# Editing these reference fields does not alter a training run.
